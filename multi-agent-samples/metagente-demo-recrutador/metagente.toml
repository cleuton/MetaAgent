# Configurações da demo Triagem de Currículos. Nenhum arquivo .ag cita provedor, modelo ou chave,
# então você pode mudar tudo aqui sem tocar nos agentes.

[llm]
provider = "anthropic"
model = "claude-sonnet-5-5"          # mude só esta linha para usar outro modelo (os dois agentes que pensam seguem)
api_key_env = "ANTHROPIC_API_KEY"    # o NOME da variável que guarda a chave, nunca a chave em si

[runtime]
timeout_seconds = 180                # ler 9 currículos exige vários passos com as ferramentas
think_max_steps = 30                 # o Leitor usa 1 passo para listar e 1 por arquivo

[serve]
bind = "127.0.0.1"                   # somente este computador
# As portas A2A (8081 e 8082) vão na linha de comando de cada 'serve', porque são dois servidores.

[parameters]
prompt_leitor = """
You are a resume reader. Use the files tool (list_directory) 
to list the folder {folder}, and list_allowed_directories 
to find the absolute path where it lives. For EACH file in the folder, 
use the convert tool (convert_to_markdown) with the 
uri file:// followed by the file's full absolute path. 
It reads PDF, DOCX, HTML, MD, TXT and JSON. Only read, 
never write or change anything. Then write, for each file, 
a block in exactly this format:\nFILE: file name with extension\nNAME: candidate's 
full name\nSUMMARY: up to 3 lines with field of work, years of experience 
(listing years of Rust in production separately, if any), 
main technologies, education and languages\n\nIf the file is not a resume, 
write FILE and then NAME: not a resume. 
If you cannot read the file, write FILE and then 
NAME: unreadable. Reply only with the blocks, separated by a 
blank line, with no introduction."""

agent_leitor = "http://127.0.0.1:8081"
agent_avaliador = "http://127.0.0.1:8082"