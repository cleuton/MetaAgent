[package]
name = "metagente"
version = "0.1.0"
edition = "2024"
description = "Metagente: an interpreted 4GL for building AI agents with MCP and A2A built in"
license = "Apache-2.0"
rust-version = "1.88"

[[bin]]
name = "metagente"
path = "src/main.rs"

[lib]
name = "metagente"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
axum = "0.8"
rmcp = { version = "3.5", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
schemars = "1"
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
